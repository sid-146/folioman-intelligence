site_name: Folioman Intelligence
site_description: Intelligence, portfolio analytics, and AI reasoning service for Folioman
site_author: Sudhanwa Kaveeshwar
site_url: https://sid-146.github.io/folioman-intelligence/
repo_url: https://github.com/sid-146/folioman-intelligence
repo_name: sid-146/folioman-intelligence

theme:
  name: material
  palette:
    # Palette toggle for light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - admonition
  - tables
  - attr_list
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Architecture: architecture.md
  - Client Guides:
      - Folioman Client: folioman-client.md
      - TickerTape Client: tickertape-client.md
  - Core Modules:
      - Repositories: repositories.md
      - Financial Analytics: analytics.md
      - Tools & Agents: tools-and-agents.md
  - Reference:
      - API Reference: api-reference.md
